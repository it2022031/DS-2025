services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    #container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog
    #container_name: mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    image: node:18
    restart: always
    working_dir: /app
    volumes:
      - ../../frontend/vue-argon-design-system-master:/app
      - node_modules:/app/node_modules
    ports:
      - "8081:8081"
    command: >
      sh -lc "cd /app && (npm ci || npm install --legacy-peer-deps) &&
      npx vue-cli-service serve --host 0.0.0.0 --port 8081"

  backend:
    build: ../../backend/demo
    container_name: backend
    restart: always
    depends_on:
      - db
      - minio
      - mailhog
    environment:
      # DB (docker network)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/demo_db
      SPRING_DATASOURCE_USERNAME: demo_user
      SPRING_DATASOURCE_PASSWORD: demo_pass

      # MailHog (docker network)
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"

      # MinIO (docker network) -> map to minio.* properties
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: property-docs
      MINIO_SECURE: "false"
    ports:
      - "8080:8080"

volumes:
  db-data:
  minio-data:
  node_modules:
