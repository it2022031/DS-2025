- name: DS-2025 Vagrant VM (full docker deploy)
  hosts: vm
  become: true

  vars:
    project_dir: /opt/DS-2025
    repo_url: "https://github.com/it2022031/DS-2025.git"
    repo_branch: "main-branch"

  tasks:
    - name: Install required packages (Docker + git)
      apt:
        name:
          - docker.io
          - docker-compose
          - git
        state: present
        update_cache: yes

    - name: Ensure docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mark repo directory as safe for git
      command: git config --global --add safe.directory "{{ project_dir }}"
      changed_when: false

    - name: Clone / update git repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ repo_branch }}"
        update: yes
        force: yes

    - name: Stop existing docker compose
      command: docker-compose down
      args:
        chdir: "{{ project_dir }}/DevOps/Docker"
      ignore_errors: yes

    - name: Run docker compose (build & up)
      command: docker-compose up -d --build
      args:
        chdir: "{{ project_dir }}/DevOps/Docker"
