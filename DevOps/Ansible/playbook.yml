- name: Deploy DS-2025 rental app
  hosts: local
  become: true

  vars:
    project_dir: /opt/DS-2025

  tasks:
    - name: Install required packages (Docker + git)
      apt:
        name:
          - docker.io
          - docker-compose
          - git
        state: present
        update_cache: yes

    - name: Stop existing docker compose
      command: docker-compose down
      args:
        chdir: "{{ project_dir }}/DevOps/Docker"
      ignore_errors: yes

    - name: Ensure docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user | default('root') }}"
        group: "{{ ansible_user | default('root') }}"
        mode: "0755"

    - name: Clone / update git repository
      git:
        repo: "https://github.com/it2022031/DS-2025.git"
        dest: "{{ project_dir }}"
        version: main-branch
        update: yes

    - name: Run docker compose (build & up)
      command: docker-compose up -d --build
      args:
        chdir: "{{ project_dir }}/DevOps/Docker"
