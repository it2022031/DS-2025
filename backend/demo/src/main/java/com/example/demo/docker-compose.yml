version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  # 🔥➕ Προσθέτουμε το MinIO εδώ — ΔΕΝ αφαιρούμε τίποτα
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"     # API (backend μιλάει εδώ)
      - "9001:9001"     # Web UI (εσύ για browsing)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
