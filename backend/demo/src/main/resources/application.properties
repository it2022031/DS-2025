# App name
spring.application.name=demo

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_db
spring.datasource.username=${DB_USER:demo_user}
spring.datasource.password=${DB_PASS:demo_pass}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.task.scheduling.pool.size=1
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
jwt.secret=cfyRnTTVec9shWfgWdWV5Q1F5IYvR7Ki8mXrq9S2Bnk=
jwt.expiration=3600000

# ---- CORS ----
# (?? ?? ????????????? ???? ??? SecurityConfig ?????? ?? ?????????, ???? ????? ??????? ?? ????? configurable)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# ---- Email / MailHog ----
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# From address
app.mail.from=no-reply@rental-app.local

# ? Public base URL used in emails (activation link)
# Local default: localhost:8080
# VM override via env: APP_PUBLIC_BASE_URL=http://127.0.0.1:8090 (? 8088)
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# ---- MinIO ----
