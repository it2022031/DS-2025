<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Ενεργοποίηση Λογαριασμού</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2ecc71;
    }
    p {
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
<div class="box">
  <h1>✅ Ο λογαριασμός ενεργοποιήθηκε</h1>
  <p>Μπορείς πλέον να συνδεθείς στην εφαρμογή.</p>
</div>
</body>
</html>
