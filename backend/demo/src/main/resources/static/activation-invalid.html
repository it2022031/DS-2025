<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Μη έγκυρη ενεργοποίηση</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d32f2f;
        }
        p {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>❌ Μη έγκυρο link</h1>
    <p>Το link ενεργοποίησης δεν είναι έγκυρο ή έχει ήδη χρησιμοποιηθεί.</p>
    <p>Παρακαλώ δοκίμασε ξανά ή κάνε νέα εγγραφή.</p>
</div>
</body>
</html>
